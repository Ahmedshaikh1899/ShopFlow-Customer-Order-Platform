services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-shopflow-password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U shopflow -d shopflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shopflow
      DB_USER: shopflow
      DB_PASSWORD: ${DB_PASSWORD:-local-shopflow-password}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
